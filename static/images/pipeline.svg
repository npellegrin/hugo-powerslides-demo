<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="pipeline-title">
  <title id="pipeline-title">Markdown, Hugo, and Hugo PowerSlides pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"></path>
    </marker>
  </defs>

  <g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">
    <rect x="20" y="70" width="160" height="80" rx="12" fill="#1f2937" stroke="#60a5fa" stroke-width="2"></rect>
    <text x="100" y="116" fill="#f9fafb">Markdown</text>

    <line x1="180" y1="110" x2="235" y2="110" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"></line>

    <rect x="240" y="70" width="160" height="80" rx="12" fill="#1f2937" stroke="#60a5fa" stroke-width="2"></rect>
    <text x="320" y="116" fill="#f9fafb">Hugo</text>

    <line x1="400" y1="110" x2="455" y2="110" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"></line>

    <rect x="460" y="70" width="160" height="80" rx="12" fill="#1f2937" stroke="#60a5fa" stroke-width="2"></rect>
    <text x="540" y="105" fill="#f9fafb">PowerSlides</text>
    <text x="540" y="132" fill="#9ca3af" font-size="16">static HTML</text>
  </g>
</svg>
